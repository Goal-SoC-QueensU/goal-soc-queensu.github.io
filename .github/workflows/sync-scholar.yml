name: Sync publications from Google Scholar

on:
  schedule:
    - cron: "23 7 * * 1"   # Mondays, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize publications
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCHOLAR_AUTHOR_ID: EzCD7v0AAAAJ
        run: python scripts/sync_scholar.py

      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No publication changes to commit."
            exit 0
          fi

          git config user.name "scholar-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "chore: sync publications from Google Scholar"
          git push
